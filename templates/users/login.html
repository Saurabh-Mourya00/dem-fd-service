{% extends "blog/base.html" %}
{% load crispy_forms_tags %}
{% load socialaccount %}
{%load static%}
{% block content %}
    <div class="content-section">
        <form method="POST">
            {% csrf_token %}
            <fieldset class="form-group">
                <legend class="border-bottom mb-4">Log In</legend>
                {{ form|crispy}}
            </fieldset>
            <div class="form-group">
                <button class="btn btn-outline-info" type="submit">Login</button>
                <small> <a class="btn btn-link" href="{% url 'password_reset' %}">Forgot Password?</a>
</small>
            </div>
        </form>
        <div class="border-top pt-3 text-center">
            <small class="text-muted">
                Or sign up with:
            </small>
    <a class="btn btn-outline-danger" href="{% provider_login_url 'google' %}"> <img src="{% static 'image/google-logo.png' %}" alt="Logo" style="width: 20px; height: 20px; margin-right: 8px;">
                Login with Google</a>
        </div>
        <div class="border-top pt-3">
            <small class="text-muted">
                Need an Account <a class="ml-2" href="{%url 'register' %}">Sign Up Now</a>
            </small>
        </div>
    </div>
{% endblock content %}
